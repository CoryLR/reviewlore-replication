[project]
name = "tailored-llm-code-review-experiment"
version = "0.1.0"
description = "Experiment code for Tailored vs. Generic LLM Code Review"
requires-python = ">=3.13"
dependencies = [
    "click",
    "httpx",
    "nltk>=3.9.2",
    "python-dotenv",
    "pyyaml",
    "rouge-score",
    "sacrebleu",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
relo = "reviewlore.tuner.cli:main"
relox = "reviewlore.experiment.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewlore"]
